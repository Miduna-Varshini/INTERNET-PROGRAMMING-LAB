<section>
<h2>Purchase Form</h2>
<form>
    <table cellpadding="5" border="0">
        <tr>
            <td >Name</td>
            <td ><input type="text" required></td>
        </tr>
        <tr>
            <td >Email</td>
            <td ><input type="email" required></td>
        </tr>
        <tr>
            <td >Phone</td>
            <td ><input type="tel"></td>
        </tr>
        <tr>
            <td >Product</td>
            <td >
                <select>
                    <option>Mobile</option>
                    <option>Laptop</option>
                    <option>Watch</option>
                </select>
            </td>
        </tr>
        <tr>
            <td >Quantity</td>
            <td ><input type="number" min="1" max="10"></td>
        </tr>
        <tr>
            <td >Delivery Date</td>
            <td ><input type="date"></td>
        </tr>
    
        <tr>
            <td >Address</td>
            <td ><textarea rows="4" cols="25"></textarea></td>
        </tr>
        <tr>
            <td >Payment</td>
            <td >
                <input type="radio" name="pay"> Cash
                <input type="radio" name="pay"> UPI
                <input type="radio" name="pay"> Card
            </td>
        </tr>
        <tr>
            <td colspan="2" >
                <input type="submit" value="Place Order">
                <input type="reset" value="Clear">
            </td>
        </tr>
    </table>
</form>
</section>
